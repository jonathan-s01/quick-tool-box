# Your home server stack. Do not edit this file: settings are in .env, which ./setup.sh makes for you.
#
#   ./setup.sh        installs Docker if needed, tunes for this computer, downloads a model, starts everything
#   ./models.sh       adds or removes AI models
#   ./docs.sh         copies the documents folder into Open WebUI's knowledge
#
# Groups of services (COMPOSE_PROFILES in .env says which run on this computer):
#   llm   llama-swap with llama.cpp: runs the AI models.                  Port 8091.
#   apps  Quick Tool Box (port 3210), Open WebUI chat (port 8080), and the helpers they use:
#         Kokoro voices, Docling document reader, SearXNG web search (these only listen on this computer).
#   bus   Bus times for Edmonton (port 3220). Optional.
# All on one computer is COMPOSE_PROFILES=llm,apps (add ,bus for bus times).

# Keep each container's log to at most 30 MB, so logs can never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- AI models (llm)

  # llama-swap starts llama.cpp with the model a request asks for, and switches models when needed.
  # Models and their tuning are in llm/llama-swap.yaml, written by ./models.sh.
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:cpu
    container_name: llama-swap
    profiles: ["llm"]
    restart: unless-stopped
    logging: *logging
    ports:
      # Reachable on your network by default, so Home Assistant and other computers can use it.
      # Set LLM_BIND=127.0.0.1 in .env to keep it on this computer only.
      - "${LLM_BIND:-0.0.0.0}:${LLM_PORT:-8091}:8080"
    volumes:
      - ./llm/llama-swap.yaml:/app/config.yaml:ro
      - ./llm/models:/models:ro

  # ---------------------------------------------------------------- apps

  quick-tool-box:
    build: .
    image: quick-tool-box:local
    container_name: quick-tool-box
    profiles: ["apps"]
    restart: unless-stopped
    init: true # cleans up finished helper programs, such as the hidden browser
    network_mode: host # keeps the real address of each visitor, so the allowed list works
    shm_size: "1gb" # Chromium needs more shared memory than Docker's default
    logging: *logging
    environment:
      PORT: "3210"
      ALLOWED_NETWORKS: "${ALLOWED_NETWORKS:-}" # empty means private home network ranges and Tailscale
      ALLOWED_HOSTNAMES: "${ALLOWED_HOSTNAMES:-}"
      LLM_MAC_URLS: "${LLM_MAC_URLS:-}"
      LLM_SERVER_URL: "${LLM_SERVER_URL:-http://localhost:8091}"
      LLM_MODELS_FILE: "/llm/models.json"
      DOCLING_URL: "${DOCLING_URL:-http://localhost:5001}"
      KOKORO_URL: "${KOKORO_URL:-http://localhost:8880}"
      MAX_JOBS: "${MAX_JOBS:-2}"
      REQUIRE_LOGIN: "${REQUIRE_LOGIN:-}"
      SHARE_TOKEN: "${SHARE_TOKEN:-}"
      WHISPER_MODELS: "/data/whisper-models" # speech to text models, kept across updates
      TZ: "${TZ:-UTC}"
    volumes:
      - ./data:/data # saved menus, profiles, forms and speech models
      - ./llm:/llm:ro # to know which models can see images

  # Bus times for Edmonton (ETS) stops: scheduled and estimated times. Port 3220.
  # Edmonton only, so it has its own group, bus. To leave it out, remove bus from COMPOSE_PROFILES in .env.
  # See bus-times/README.md for putting a reverse proxy (such as Caddy) in front of it.
  bus-times:
    build: ./bus-times
    image: bus-times:local
    container_name: bus-times
    profiles: ["bus"]
    restart: unless-stopped
    network_mode: host # keeps the real address of each visitor, so ALLOWED_NETWORKS works
    logging: *logging
    environment:
      PORT: "${BUS_PORT:-3220}"
      ALLOWED_NETWORKS: "${ALLOWED_NETWORKS:-}"
      TZ: "America/Edmonton" # the bus schedule is in Edmonton time
    volumes:
      - bus-times-data:/data # saved stops and the downloaded schedule (a Docker volume, so permissions just work)

  # Text to speech (CPU version). About 1.5 GB of memory.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro
    profiles: ["apps"]
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8880:8880"

  # Document reader (CPU version). About 2 to 4 GB of memory while reading.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: docling
    profiles: ["apps"]
    restart: unless-stopped
    logging: *logging
    environment:
      DOCLING_SERVE_MAX_SYNC_WAIT: "900" # seconds; long bills and scans can take a while on a CPU
    ports:
      - "127.0.0.1:5001:5001"

  # Private web search for Open WebUI. Settings are in searxng/settings.yml.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    profiles: ["apps"]
    restart: unless-stopped
    logging: *logging
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Run ./setup.sh first}"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8888:8080"

  # Chat: switching models, documents (knowledge), web search, workspaces.
  # These settings only apply the FIRST time Open WebUI starts. After that, change them in
  # Open WebUI under Admin Panel, Settings.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    profiles: ["apps"]
    restart: unless-stopped
    network_mode: host # so it can reach llama-swap, Kokoro, Docling and SearXNG on this computer
    logging: *logging
    environment:
      PORT: "8080"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?Run ./setup.sh first}"
      # Models: the server's llama.cpp (OpenAI-compatible) and the Mac's Ollama (Ethernet and Wi-Fi addresses).
      OPENAI_API_BASE_URLS: "${LLM_SERVER_URL:-http://localhost:8091}/v1"
      OPENAI_API_KEYS: "none"
      ENABLE_OLLAMA_API: "${OPEN_WEBUI_USE_MAC:-false}"
      OLLAMA_BASE_URLS: "${OPEN_WEBUI_OLLAMA_URLS:-http://localhost:11434}"
      AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST: "3" # do not wait long for the Mac when it is asleep
      AIOHTTP_CLIENT_TIMEOUT: "1800" # the server's processor can take minutes on a long question
      # Extra AI requests after every message (titles, tags, suggestions) slow down a processor a lot.
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      # Web search through SearXNG (old and new setting names, for different versions).
      ENABLE_WEB_SEARCH: "true"
      ENABLE_RAG_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      RAG_WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://localhost:8888/search?q=<query>"
      # Documents are read by Docling.
      CONTENT_EXTRACTION_ENGINE: "docling"
      DOCLING_SERVER_URL: "http://localhost:5001"
      # Read aloud with Kokoro.
      AUDIO_TTS_ENGINE: "openai"
      AUDIO_TTS_OPENAI_API_BASE_URL: "http://localhost:8880/v1"
      AUDIO_TTS_OPENAI_API_KEY: "not-needed"
      AUDIO_TTS_MODEL: "kokoro"
      AUDIO_TTS_VOICE: "af_heart"
      TZ: "${TZ:-UTC}"
    volumes:
      - ./open-webui:/app/backend/data # chats, users, knowledge and settings

volumes:
  bus-times-data:
